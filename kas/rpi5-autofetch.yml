header:
  version: 18

distro: iotgw

machine: raspberrypi5

target:
  - iot-gw-image-base

repos:
  # Full standalone wrynose stack (SHA-pinned to match rpi5.yml / kas/rauc.yml
  # / kas/tpm.yml). Kept in lockstep with those files; meta-security and
  # meta-lts-mixins removed for wrynose.
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers: {}
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 6bf0d8ad57b33950bab4c7f6c037e1ccb6f6e2eb
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose
    commit: 4a9f704d82a8a5d65aaffa598eeaeb86f1cb5b86

  # Pin and carried patches mirror rpi5.yml; the rationale lives there.
  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: master
    commit: 7351443c6579671bcf048817438f1740ad23eaab
    patches:
      0001-cve-2026-59676-status:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0001-selinux-ignore-CVE-2026-59676-in-components-excludin.patch
      0002-cve-2026-59677-status:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0002-selinux-ignore-CVE-2026-59677-in-components-excludin.patch
      0003-selinux-sandbox-cve-2026-59676:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0003-selinux-sandbox-fix-CVE-2026-59676.patch
      0004-selinux-sandbox-cve-2026-59677:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0004-selinux-sandbox-fix-CVE-2026-59677.patch
      0005-selinux-image-validate-contexts:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0005-selinux-image-validate-contexts-against-the-image-policy.patch

  meta-secure-core:
    url: https://github.com/Wind-River/meta-secure-core
    branch: wrynose
    commit: 07a99ae241acd488a2feda1ededf87dc70dfde80
    layers:
      meta-tpm2:
      meta-signing-key:
      meta-integrity:

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

  # meta-rauc-community dropped — see kas/rauc.yml for the absorption note.

  # Project layer lives in this repo (see rpi5.yml for the rationale on the
  # no-url/path current-repo form vs KAS_WORK_DIR).
  rpi5-iot-gw:
    layers:
      meta-iot-gateway:

bblayers_conf_header:
  standard: |
    BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"

  diskmon: |
    # Kept in lockstep with rpi5.yml's diskmon block — see the rationale there.
    # This standalone entry point builds the same tree with the same appetite,
    # so it gets the same floors; a divergence here would silently reinstate
    # poky's 1G/100M guard for anyone building from this file.
    BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},15G,100K \
    STOPTASKS,${DL_DIR},15G,100K \
    STOPTASKS,${SSTATE_DIR},15G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},10G,1K \
    HALT,${DL_DIR},10G,1K \
    HALT,${SSTATE_DIR},10G,1K \
    HALT,/tmp,10M,1K"

  buildinfo: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  spdx_disable: |
    # Keep SBOM/CVE generation opt-in via kas/cve.yml to save disk/time on
    # normal image builds. kas/cve.yml clears this toggle before explicitly
    # enabling the wrynose create-spdx + sbom-cve-check flow.
    IOTGW_CREATE_SPDX_DISABLE ?= "create-spdx"
    INHERIT:remove = "${IOTGW_CREATE_SPDX_DISABLE}"

  optimize: |
    USER_CLASSES = "buildstats"

  parallel: |
    BB_NUMBER_THREADS = "10"
    PARALLEL_MAKE = "-j12"
  rm_work: |
    # Reduce disk usage by discarding intermediate workdirs
    INHERIT += "rm_work"

  rpi_hardware: |
    ENABLE_SPI_BUS = "1"
    ENABLE_I2C = "1"
    ENABLE_UART = "1"

  rpi_display: |
    DISABLE_OVERSCAN = "1"
    DISABLE_SPLASH = "1"

  rpi_extras: |
    # Accept the Synaptics WiFi/BT firmware license flag required on RPi
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  image_hw_modules: |
    KERNEL_MODULE_AUTOLOAD:append = " i2c-dev"

  prefer_bin_node: |
    # Use prebuilt Node.js binary to avoid long V8 builds
    PREFERRED_PROVIDER_nodejs = "nodejs-bin"

  sanity_check: |
    # Add Ubuntu 24.04 to tested distributions to avoid warnings
    SANITY_TESTED_DISTROS:append = " ubuntu-24.04"
  hashserve: |
    # Hash-equivalence DB in the shared SSTATE_DIR, as in rpi5.yml (rationale
    # there): builds share sstate only when they also share this DB path.
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
  rauc_providers: |
    PREFERRED_RPROVIDER_virtual-rauc-conf = "rauc-conf-iotgw"
  boot_splash_opt_in: |
    # To include the U-Boot splash image in the boot (FAT) partition, uncomment:
    # FATPAYLOAD += " /boot/splash.bmp"

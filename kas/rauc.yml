header:
  version: 18
  includes:
    - "rpi5.yml"

distro: iotgw

repos:
  # meta-rauc only. The Raspberry Pi pieces the images need (the
  # rauc-grow-data-part subpackage, u-boot-fw-utils/u-boot-env RDEPENDS, the
  # /data mount point) live in meta-iot-gateway (recipes-ota/rauc/rauc_%.bbappend,
  # base-files bbappend); the boot flow, keys and wic layout are the custom
  # RAUC/FIT setup. U-Boot is OE-core's stock recipe.

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

local_conf_header:
  rauc_providers: |
    PREFERRED_RPROVIDER_virtual-rauc-conf = "rauc-conf-iotgw"
  boot_splash_opt_in: |
    # To include the U-Boot splash image in the boot (FAT) partition, uncomment:
    # FATPAYLOAD += " /boot/splash.bmp"

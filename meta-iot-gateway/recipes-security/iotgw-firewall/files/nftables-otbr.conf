    # The OTBR agent REST API (:8081) binds loopback only (otbr-agent
    # --rest-listen-address 127.0.0.1) and is never admitted here; the base
    # ruleset drops it on every interface but lo.
    #
    # mDNS for the OTBR advertising proxy / border-router discovery, on the
    # infrastructure interface only (otbr-agent -B). Both families: Thread
    # and Matter discovery is IPv6-first.
    iifname "@OTBR_INFRA_IFACE@" meta nfproto ipv4 udp dport 5353 accept
    iifname "@OTBR_INFRA_IFACE@" meta nfproto ipv6 udp dport 5353 accept
    #
    # Port 443 is deliberately NOT admitted. Nothing on the image listens on it,
    # and an accept rule with no service behind it is a standing authorisation
    # for whatever binds there next. Re-add it in the same commit that
    # introduces a TLS listener, not before.

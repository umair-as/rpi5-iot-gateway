    # Thread <-> infrastructure forwarding for the OpenThread Border Router
    # (otbr-agent -I wpan0 -B @OTBR_INFRA_IFACE@). Spliced into the baseline
    # forward chain only when the OTBR feature is built in.
    #
    # Thread -> infrastructure carries two families: native IPv6 (OMR-prefixed
    # Thread devices reaching the LAN and beyond; MLR multicast proxied by
    # the backbone router) and IPv4 produced by the border router's NAT64
    # translator, which leaves wpan0 with a source in its NAT64 pool and is
    # masqueraded on the way out by otbr-ipset-init's "ip otbr_nat" table
    # (postrouting, after this chain). Egress follows the routing table, so
    # the outgoing interface is whichever carries the default route (the
    # infrastructure interface or the wired bridge), not wpan0 again.
    iifname "wpan0" oifname != "wpan0" accept
    # Infrastructure -> Thread is IPv6 only: new connections from the LAN to a
    # Thread device's OMR address, plus multicast toward the mesh. IPv4 reaches
    # wpan0 only as NAT64 return traffic, already admitted as established.
    #
    # otbr-agent's own "inet otbr" forward chain (policy accept, admits
    # anything to or from the infrastructure interface) adds nothing to what
    # this pair admits and cannot widen it. The ipset sets otbr-ipset-init
    # creates (otbr-ingress-deny-src / -allow-dst) are the upstream border
    # router's anti-spoofing and on-mesh-destination filter; no rule on this
    # image consults them (they are xtables sets, and the kernel is
    # nftables-only), so that finer filter is not in force here.
    iifname "@OTBR_INFRA_IFACE@" oifname "wpan0" meta nfproto ipv6 accept

# Simple baseline nftables ruleset (IPv4/IPv6)
# Do not flush the whole ruleset; other services (e.g. OTBR) manage their own tables.
# iotgw-nftables.service deletes this table in ExecStartPre (ignored if missing)
# before loading this file, so this config remains idempotent.
#
# ADDRESS FAMILY: this is a "table inet", so a rule written as
# "tcp dport 22 accept", with no family match, admits the port on IPv4 AND
# IPv6 alike. That is almost never what a service rule means here, and it is
# how SSH became reachable over a global IPv6 address. Every service rule below
# therefore carries an explicit "meta nfproto" match.
#
# Rule of thumb for anything added here: if a rule names a port, it must also
# name a family. Enforced both at build time (do_install bbfatals on any dport
# rule with no family token) and against the live ruleset on target.

# The container principal and the subordinate range its containers map into.
define IOTGW_CTR_UIDS = { @IOTGW_CTR_UID@, @IOTGW_CTR_SUBID_RANGE@ }

table inet filter {
  chain input {
    type filter hook input priority 0;
    policy drop;

    # Basic sanity
    iifname "lo" accept

    # Established/related
    ct state established,related accept

    # ICMP/ICMPv6 (ping, errors)
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # Unauthenticated management ports are never reachable from the network:
    # 80 (OTBR web UI) and 8081 (OTBR agent REST API). The drop policy already
    # covers them; these rules keep it so if a broader accept is added below.
    # The dev and desktop images admit the web UI over IPv4 at the marker,
    # which iotgw-rootfs.bbclass fills or removes per image
    # (IOTGW_IMAGE_OTBR_WEBUI). Loopback is accepted above.
    @OTBR_WEBUI_RULES@
    meta nfproto ipv4 tcp dport { 80, 8081 } drop
    meta nfproto ipv6 tcp dport { 80, 8081 } drop

    # SSH, IPv4 only. The listener is pinned to 0.0.0.0:22 by
    # sshd_config.d/05-iotgw-listen.conf; this rule is the second, independent
    # expression of the same intent, so neither control alone is load-bearing.
    meta nfproto ipv4 tcp dport 22 accept
    @OTBR_RULES@
  }

  # FORWARDING is default-deny. The kernel forwards between every interface
  # (net.ipv4.ip_forward / net.ipv6.conf.all.forwarding are on for the Thread
  # border router), so without this chain any host on one attached network
  # could route through the gateway into another. Each interface pair that
  # may be forwarded is named explicitly; nothing else is.
  #
  # This chain is final for every forwarded packet: an "accept" in another
  # table's forward chain (OTBR's "inet otbr", a container engine's own table)
  # only ends evaluation in that chain, and the packet still has to pass here.
  # So every forwarding path a service needs must be admitted below, next to
  # the service that needs it.
  #
  # Containers need no entry: rootless podman uses pasta, which terminates
  # container traffic in host sockets instead of routing a bridge, so no
  # forwarded packet exists.
  chain forward {
    type filter hook forward priority 0;
    policy drop;
    ct state established,related accept
    ct state invalid drop
    @OTBR_FORWARD_RULES@
  }

  chain output {
    type filter hook output priority 0;
    policy accept;
    # Containers must not reach the gateway's own services. pasta proxies their
    # traffic as the container principal, and a connection to any local address
    # leaves through lo, so this holds for every address family and whatever
    # the engine was asked to map. The subordinate range covers a socket opened
    # by a mapped uid in this network namespace. DNS stays open to the local
    # resolver only. Multicast and broadcast are dropped because they loop back
    # to local listeners through the outgoing interface rather than lo. Drop:
    # the kernel carries no nftables reject.
    meta skuid $IOTGW_CTR_UIDS oifname "lo" ip daddr { 127.0.0.53, 127.0.0.54 } meta l4proto { tcp, udp } th dport 53 accept
    meta skuid $IOTGW_CTR_UIDS oifname "lo" ct state new drop
    meta skuid $IOTGW_CTR_UIDS ip daddr { 224.0.0.0/4, 255.255.255.255 } drop
    meta skuid $IOTGW_CTR_UIDS ip6 daddr ff00::/8 drop
  }
}

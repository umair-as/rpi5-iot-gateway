# IoT Gateway SSH server policy, PRODUCTION override (iotgw-sshd-hardening-prod).
#
# sshd keeps the first value it reads for a keyword and includes
# sshd_config.d/*.conf in lexical order, so these lines take precedence over
# 99-iotgw.conf, which every image ships. 99-iotgw.conf already turns password
# and keyboard-interactive authentication off; the lines are repeated here so
# the prod policy does not depend on the shared file staying that way, and so
# the prod hygiene gate (iotgw-rootfs.bbclass) has one file to require.
#
# Prod is a closed appliance: it ships no authorized key and no account with a
# password, so sshd has no usable authentication path. The directives below
# keep an authenticated session, should one ever exist, from turning the
# device into a relay (TCP, Unix-socket and tunnel forwarding default to
# allowed in sshd).
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitRootLogin no
AllowUsers iotgw-ops
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u

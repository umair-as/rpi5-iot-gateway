# IoT Gateway SSH server policy: every image tier.
#
# SCOPE: authentication and session policy only. Listen scope (IPv4 only)
# lives in 05-iotgw-listen.conf, shipped by openssh-sshd itself so no image
# can install sshd without it. UsePAM yes comes from meta-selinux's
# 50-selinux.conf and OE-Core's sshd_config once the pam distro feature is on.
#
# sshd keeps the FIRST value it reads for a keyword. sshd_config.d/*.conf is
# included at the top of sshd_config in lexical order, so a lower-numbered
# drop-in (10-iotgw-prod-auth.conf on prod) wins over this file, and this
# file wins over the body of sshd_config.

# Display legal banner before authentication
Banner /etc/issue.net

# Keys only. The developer and operator keys are provisioned by the build
# (iotgw-dev-ssh-keys on dev/desktop, the operator key on prod); the layer
# ships no password hash, and a bench password set in kas/local.yml serves the
# serial console, sudo and newrole, never the network.
# With UsePAM yes a password prompt over SSH would be a brute-force surface
# against the same hashes on every bench.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Root may log in by key only, on every tier.
PermitRootLogin prohibit-password

# No X11 forwarding on any tier. OE-Core's openssh recipe turns it on in the
# body of sshd_config whenever the x11 distro feature is set, which the
# desktop profile keeps for its file manager; nothing on the image runs an X
# client, and this drop-in is read before the body.
X11Forwarding no

# Avoid double MOTD (PAM usually shows /etc/motd)
PrintMotd no
PrintLastLog yes

# Mild rate limiting / UX tuning
LoginGraceTime 30s
MaxAuthTries 6
MaxSessions 10

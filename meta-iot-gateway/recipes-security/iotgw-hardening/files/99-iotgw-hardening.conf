# IoT Gateway Security Hardening - Sysctl Configuration
# Based on Lynis audit recommendations and CIS benchmarks

# Network hardening
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Loose rp_filter for multi-homed/bridge setups to avoid false martians
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_timestamps = 0

# IPv6 hardening (disable if not needed, or harden)
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Kernel hardening
kernel.randomize_va_space = 2
# mmap ASLR entropy: the kernel maximum (ARCH_MMAP_RND_BITS_MAX, 4K pages / 52-bit
# VA). The build default is 18; raising it in the kernel config needs EXPERT=y.
# Applies to processes started after systemd-sysctl.
vm.mmap_rnd_bits = 33
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
# The three keys below exist only with the matching kernel option, all of
# which igw_security_prod (security-prod.cfg) or the arm64 defconfig set:
# CONFIG_SECURITY_YAMA, CONFIG_MAGIC_SYSRQ, CONFIG_KEXEC. systemd-sysctl logs
# a missing key and continues, so a kernel without one does not fail boot.
#
# ptrace: Yama's relational scope (a process may trace only its descendants).
# Yama's compiled-in default is the same value; stated here so the policy is
# explicit and testable rather than inherited.
kernel.yama.ptrace_scope = 1
# SysRq: masked at runtime on every tier. The kernel keeps the SysRq code
# (CONFIG_MAGIC_SYSRQ=y, default mask 0 from security-prod.cfg) so the
# crash-debug lab profile can re-enable it: sysrq_always_enabled=1 on the
# signed command line (IOTGW_ENABLE_CRASH_DEBUG_DEV) overrides this mask in
# the kernel, and nothing else can. Without it, a UART or tty holder cannot
# crash, reboot or kill-all the device through the SysRq key.
kernel.sysrq = 0
# kexec: no image loads a replacement kernel at runtime. Recovery is A/B slot
# fallback through U-Boot, and there is no kdump userspace. One-way: once set,
# only a reboot clears it, so a root process cannot re-enable it either.
kernel.kexec_load_disabled = 1

# Filesystem hardening
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0

[Service]
# wpa_supplicant@<iface> parses frames from any transmitter in range before any
# authentication (scan IEs, EAPOL). It runs as root because nl80211 needs
# CAP_NET_ADMIN; everything else root could do is taken away here. This is the
# SECOND layer: the SELinux domain (NetworkManager_t in refpolicy) is the
# first; these restrictions must also stand on their own, as a composition may
# set IOTGW_SELINUX_MODE = "permissive".
NoNewPrivileges=true
# nl80211/netlink and the EAPOL raw socket; CAP_CHOWN for chgrp of the control
# socket directory to GROUP=netdev (ctrl_interface=DIR=... GROUP=netdev).
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_CHOWN
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_PACKET AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
# Read-only system; update_config=1 rewrites the interface configuration file
# (rename in place), and the control sockets live under /run/wpa_supplicant.
ProtectSystem=strict
ReadWritePaths=/etc/wpa_supplicant
RuntimeDirectory=wpa_supplicant
RuntimeDirectoryPreserve=yes
ProtectHome=true
# wpa_cli creates its reply socket in /tmp. PrivateTmp isolates that path from
# wpa_supplicant, so the daemon receives commands but cannot reply.
PrivateTmp=false
# wpa_supplicant writes per-interface IPv4 sysctls (drop_unicast_in_l2_multicast,
# drop_gratuitous_arp) on association; keep /proc/sys writable.
ProtectKernelTunables=false
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true

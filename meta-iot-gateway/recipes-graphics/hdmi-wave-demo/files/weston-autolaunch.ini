# Alternative to hdmi-wave-demo.service: append to the image's weston.ini
# (in this distro: meta-iot-gateway/recipes-graphics/weston/files/weston.ini,
# shipped by weston-init). Weston 15 allows one [autolaunch] entry; it runs
# path= with no arguments, as the compositor's own user, and does not restart
# it. watch=false keeps Weston running when the demo exits.
[autolaunch]
path=@LIBEXECDIR@/hdmi-wave-demo/kiosk
watch=false

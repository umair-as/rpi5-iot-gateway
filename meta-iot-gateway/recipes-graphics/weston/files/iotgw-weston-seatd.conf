# weston holds its seat through seatd (libseat). When seatd stops, libseat's
# connection breaks and weston exits (status 255), so a seatd restart left the
# compositor failed. PartOf= stops and restarts weston with seatd; After= orders
# the start. seatd is Type=simple, so "started" precedes its /run/seatd.sock and
# the restarted weston can lose that race: Restart= retries it.
[Unit]
After=seatd.service
PartOf=seatd.service

[Service]
Restart=on-failure
RestartSec=1

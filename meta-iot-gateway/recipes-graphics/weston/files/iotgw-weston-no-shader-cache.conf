# The compositor runs as a confined system service (iotgw_weston_t) with its
# home on /data. Mesa's on-disk shader cache would make it a writer of
# ~/.cache/mesa_shader_cache for the compositor's own handful of shaders; the
# policy does not grant that path, and a cache for them is not worth a
# persistent write path from the display server. Disabled here. This is
# Mesa behaviour, not a security boundary: the policy still refuses the write.
[Service]
Environment=MESA_SHADER_CACHE_DISABLE=true

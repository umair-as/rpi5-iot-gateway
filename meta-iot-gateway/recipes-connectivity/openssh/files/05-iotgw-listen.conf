# Listen scope of the SSH server: IPv4 only.
#
# sshd binds its own listener (sshd.service, "sshd -D"), so these lines are
# what decides the address family. Without them sshd binds dual-stack and,
# with a global IPv6 address on any interface, answers off-link where no NAT
# sits in the path. The nftables rule for port 22 is the second, independent
# control.
#
# sshd keeps the first value it reads for a keyword and includes
# sshd_config.d/*.conf at the top of sshd_config, so the low number makes this
# file win over any later drop-in.
AddressFamily inet
ListenAddress 0.0.0.0

# Verify on target: `sshd -T -f /etc/ssh/sshd_config_readonly | grep -E
# '^(addressfamily|listenaddress)'` and `ss -tlnH 'sport = :22'`.

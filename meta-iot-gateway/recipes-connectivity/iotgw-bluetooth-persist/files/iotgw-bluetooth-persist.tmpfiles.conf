# Persistent backing on /data for Bluetooth adapter identity + device pairings
# (bound over the volatile /var/lib/bluetooth by var-lib-bluetooth.mount).
d /data/lib 0755 root root -
d /data/lib/bluetooth 0700 root root -

# The mount point on the volatile /var/lib, created before the bind (the mount
# unit orders after systemd-tmpfiles-setup). Without /data the bind is skipped
# and this empty directory is what bluetoothd writes to: Bluetooth works,
# pairings last until the next reboot. Same mode and owner as the backing dir.
d /var/lib/bluetooth 0700 root root -

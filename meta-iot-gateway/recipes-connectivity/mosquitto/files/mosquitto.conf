# Mosquitto MQTT Broker Configuration for IoT Gateway

# Persist retained messages/sessions on the persistent /data partition so they
# survive reboot and A/B updates (/var/lib is volatile tmpfs on this image).
persistence true
persistence_location /data/mosquitto/
autosave_interval 180

# Keep logs useful but not overly verbose by default.
log_dest stderr
log_timestamp true
connection_messages false
log_type error
log_type warning
log_type notice

# Listener for gateway/client MQTT traffic: LOOPBACK ONLY. Local clients
# connect to localhost; the firewall does not admit 1883, and a wildcard bind
# (0.0.0.0 and [::]) would be a pre-authentication parser one firewall mistake
# from exposure. A customer who
# needs the broker on the LAN or from containers adds a second listener in
# conf.d/ (customisation contract, tier 2), e.g. `listener 1883 <br0 address>`
# together with an explicit IPv4 firewall rule.
listener 1883 127.0.0.1
protocol mqtt

# Basic abuse controls.
allow_zero_length_clientid false
max_inflight_messages 32
max_queued_messages 512
max_packet_size 1048576
message_size_limit 1048576

# Additional hardening/auth policy.
include_dir /etc/mosquitto/conf.d

# ── U-Boot production lockdown — token: appliance_lockdown ────────────────────
# Production only. Do NOT include in dev builds.
# Requires the release FIT trust profile (YubiKey root only, no dev file or
# SoftHSM key) — enforced by iotgw-uboot-prod-key-guard.bbclass.

# ── Boot delay ────────────────────────────────────────────────────────────────

# Compile -2 as the built-in default: no interactive window before autoboot.
CONFIG_BOOTDELAY=-2

# Keyed autoboot is irrelevant with BOOTDELAY=-2 but disable explicitly
# so the stop-string committed in patch 0001 cannot be used even if the
# env partition is tampered to restore a positive delay value.
CONFIG_AUTOBOOT_KEYED=n

# ── Environment protection ────────────────────────────────────────────────────

# Remove interactive env editing command.
CONFIG_CMD_EDITENV=n

# Keep runtime writes constrained to RAUC-required variables.
CONFIG_ENV_WRITEABLE_LIST=y
# Under ENV_WRITEABLE_LIST, only variables with :w access are mutable.
# Keep RAUC state writable and lock appliance gates read-only.
# EXTRA_KERNEL_ARGS:sr is defensive — under WRITEABLE_LIST, vars not on
# the list are rejected by default, so this entry is technically redundant.
# Listing it explicitly makes the prod policy visible and protects against
# future upstream default-policy changes. The dev-image counterpart of this
# var (writable, used as a runtime cmdline-tuning escape hatch — see
# docs/UBOOT_HARDENING.md and docs/KERNEL.md) is dead code on prod thanks
# to this entry: U-Boot will reject any fw_setenv attempt, so the
# `if test -n "${EXTRA_KERNEL_ARGS}"` clause in iotgw_set_bootargs never
# triggers.
#
# The actual list of writeable/read-only variables lives in
# files/0005-rpi-iotgw-prod-env-flags-list-static.patch -- CFG_ENV_FLAGS_LIST_STATIC
# is a C preprocessor macro (see include/env_flags.h), not a Kconfig symbol,
# so it cannot be set from this defconfig fragment: merge_config silently
# drops unknown CONFIG_* lines instead of erroring, so a stray CONFIG_ENV_-
# FLAGS_LIST_STATIC line here would appear to apply but silently do nothing.

# Prevent the -f (force) flag from bypassing variable access controls.
CONFIG_ENV_ACCESS_IGNORE_FORCE=y

# ── Boot path ────────────────────────────────────────────────────────────────

# Signed-FIT bootm is the only way to start an OS. booti boots a raw kernel
# Image and go jumps to any loaded binary, both without FIT signature
# verification. The lockdown above leaves them unreachable (no prompt, bootcmd
# not loadable from the env), so dropping them is defence in depth: a future
# boot-script bug cannot become a signature bypass. Nothing in the iotgw boot
# path uses either; dev builds keep them for bench debugging.
CONFIG_CMD_BOOTI=n
CONFIG_CMD_GO=n

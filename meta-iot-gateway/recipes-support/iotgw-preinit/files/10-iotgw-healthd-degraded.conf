[Service]
# edge-healthd keeps its boot history in /data/edge/health. Without /data the
# path does not exist, and a plain ReadWritePaths= entry fails the mount
# namespace before the daemon starts (226/NAMESPACE). The daemon is what
# reports a degraded device, so it has to run then: the "-" makes the path
# optional, and the daemon logs that it cannot save its state and keeps going.
# This replaces the upstream unit's ReadWritePaths list, which is only this
# path; re-check on every edge-healthd SRCREV bump.
ReadWritePaths=
ReadWritePaths=-/data/edge/health

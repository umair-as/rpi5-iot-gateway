# A degraded boot of a slot that has not yet had a healthy boot since its
# install is not marked good (iotgw-mark-good-gate). Every other boot, degraded
# or not, is. ExecCondition skips the unit without failing it, so the boot
# counter is simply not reset.
[Unit]
After=uboot\x2denv.mount

[Service]
ExecCondition=/usr/libexec/iotgw/iotgw-mark-good-gate check
ExecStartPost=-/usr/libexec/iotgw/iotgw-mark-good-gate commit

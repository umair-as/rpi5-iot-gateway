[Unit]
# A boot without /data (pre-init marker) must not install updates: the install
# path stages bundles and keeps RAUC's slot status on /data. The bundle's
# pre-install hook refuses as well, which also covers installs not started by
# this service. Marking the slot good is gated separately
# (rauc-mark-good.service.d/10-iotgw-mark-good-gate.conf).
ConditionPathExists=!/run/iotgw/degraded

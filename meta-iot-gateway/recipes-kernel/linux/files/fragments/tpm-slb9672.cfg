# TPM 2.0 over SPI (Infineon SLB9672 class devices).
# TPM 2.0 support is part of the TCG_TPM core; there is no separate TCG_TPM2 symbol.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS=y
CONFIG_TCG_TIS_SPI=y
CONFIG_HW_RANDOM_TPM=y

# SPI host path for Raspberry Pi.
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y

# SPI userspace nodes (spidev) stay off: one on the TPM's chip-select would
# contend with tpm_tis_spi for the device. Enable only for bring-up/debug and
# never on the TPM chip-select.
# CONFIG_SPI_SPIDEV is not set

# Capabilities given up on purpose. Re-enabling one is a product decision:
# remove its line here and add the support it needs as its own fragment.
# Cellular modems over MHI (PCIe/USB M.2 5G/LTE modules) and the Qualcomm IPC
# router they use.
# CONFIG_MHI_BUS is not set
# CONFIG_QRTR is not set
# PCIe slot power sequencing from devicetree supplies. The board's PCIe slot
# has no such supplies; pci-pwrctrl-slot binds to nothing.
# CONFIG_PCI_PWRCTRL_SLOT is not set

# Kept explicitly: the trim removed their only selector (see the header).
# Regulator framework and the two drivers the board devicetree uses: SD-card
# power (vcc-sd), SD I/O voltage switching (vdd-sd-io), Wi-Fi power (wl-on).
# Without them both SDHCI controllers probe late and the card cannot switch to
# UHS signalling.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_GPIO=y
# tmpfs for /run, /dev/shm, /tmp and the pre-init /etc overlay; extended
# attributes carry SELinux labels on it.
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
# Contiguous DMA memory for the VC4 display pipeline and other DMA users.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
# Power sequencing core (pwrseq_core, loaded on the board).
CONFIG_POWER_SEQUENCING=m
# Backlight class: DRM panel drivers depend on it. Kept with the panels for
# the desktop image.
CONFIG_BACKLIGHT_CLASS_DEVICE=m

# Attack-surface reduction: hardware a Raspberry Pi 5 can never have.
#
# The base configuration is the multi-platform arm64 defconfig, which enables
# every vendor's SoC platform and the drivers behind it. This fragment removes
# what cannot exist on a BCM2712 + RP1 board, for every image tier. Plug-in
# and debug surfaces that a developer can attach or use (USB serial/Ethernet/
# storage, HID, tracing) are not in scope here.
#
# Every line here is enforced: iotgw-kernel-fragments.bbclass fails the build
# when a line of any layer fragment does not hold in the final .config. Each
# symbol is user-settable; a select-only or prompt-gated (EXPERT, COMPILE_TEST)
# symbol is not listed. No symbol here is set by any other layer fragment: this
# is the last layer fragment merged, so an overlap would silently override a
# feature fragment. (The yocto-kernel-cache features merge after it.)
#
# Trimming platforms also removes what only they selected. The base defconfig
# is savedefconfig-minimal: frameworks the board needs but that some platform
# always selected (regulators, tmpfs, CMA, thermal) are absent from it and fall
# to "not set" once the platforms go. Those are requested explicitly in the
# keep section at the end (thermal in thermal-rpi5.cfg).
#
# Deliberately NOT trimmed (the board needs or loads them):
#   ARCH_BCM, ARCH_BCM2835, ARCH_BRCMSTB  - BCM2712 drivers depend on both
#       platform symbols; RTC_DRV_RPI and PHY_BRCM_USB depend on ARCH_BRCMSTB
#       alone. Other Broadcom SoCs (iProc, BCA) are trimmed below.
#   RP1: MISC_RP1 (rp1_pci), COMMON_CLK_RP1, PINCTRL_RP1, MACB (RP1 GEM),
#       USB_DWC3, SPI_DW_MMIO; BCM2712_MIP and PCIE_BRCMSTB (built in by
#       pcie-rpi5.cfg)
#   Firmware and power: RASPBERRYPI_FIRMWARE, CLK_RASPBERRYPI,
#       ARM_RASPBERRYPI_CPUFREQ, SENSORS_RASPBERRYPI_HWMON, RASPBERRYPI_POWER,
#       POWER_SEQUENCING (pwrseq_core), BCM2711_THERMAL, BCM2835_WDT
#   Ethernet PHY: BROADCOM_PHY, BCM_NET_PHYLIB
#   Wireless: WLAN_VENDOR_BROADCOM, BRCMFMAC (SDIO), BRCMUTIL, CFG80211;
#       Bluetooth BT_HCIUART with its BCM and QCA protocols (btbcm, btqca)
#   Display: DRM_VC4, DRM_V3D, SND_SOC_HDMI_CODEC (HDMI console and audio)
#   TPM: TCG_TIS_SPI (SLB9670 on RP1 SPI0)
#   Third-party add-on buses stay: I2C/SPI codecs, DRM bridges and panels,
#   camera sensors, PMICs, PCIe NICs other than the vendors below, USB
#   devices. A HAT or the PCIe connector can carry them. Codecs reachable
#   only through another SoC's machine driver go with that SoC. DRM panels
#   and backlights are kept for the desktop image.
#
# Capabilities given up on purpose are listed at the end, so a later need
# shows up as a deliberate change to that section.


# Firewalling is nftables only: the OTBR/gateway rules and podman's netavark
# (firewall_driver = "nftables") all program nf_tables. The legacy x_tables
# engine (iptables-legacy's ip_tables/ip6_tables) is not built. iptables-nft,
# if ever installed, runs on nf_tables and needs none of this.
#
# Merged after the yocto-kernel-cache features. meta-virtualization adds the
# cache's docker feature for DISTRO_FEATURES "virtualization", and from the
# yocto-6.18 cache on, that feature turns the legacy engine (kernel 6.17+
# NETFILTER_XTABLES_LEGACY) and IPVLAN on. Docker needs them; iotgw runs
# neither Docker nor IPVLAN networks.
# CONFIG_NETFILTER_XTABLES_LEGACY is not set
# CONFIG_IPVLAN is not set
# xtables extensions the docker feature adds; unused here.
# CONFIG_NETFILTER_XT_MATCH_BPF is not set
# CONFIG_NETFILTER_XT_NAT is not set
# CONFIG_NETFILTER_XT_TARGET_MASQUERADE is not set
# Selected during the cache merge by IPVLAN_L3S and the legacy REJECT
# targets; switching those off afterwards leaves the values set.
# CONFIG_NET_L3_MASTER_DEV is not set
# CONFIG_NF_REJECT_IPV4 is not set
# CONFIG_NF_REJECT_IPV6 is not set

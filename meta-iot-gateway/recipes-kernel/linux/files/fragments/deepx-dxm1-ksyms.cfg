# DX-M1 accelerator: keep every exported kernel symbol.
#
# Trimming unused ksyms drops exports that no in-tree module uses, and the
# out-of-tree dx_dma.ko is invisible to it. A symbol allowlist
# (CONFIG_UNUSED_KSYMS_WHITELIST) broke on every driver re-pin and every
# kernel-surface change that removed an in-tree user of a symbol the driver
# needs. Module signing with sig_enforce stays the barrier against foreign
# modules. Merged after security-prod.cfg, which turns the trim on.
# CONFIG_TRIM_UNUSED_KSYMS is not set

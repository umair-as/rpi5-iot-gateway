# Trim unused network filesystems/services for headless gateway builds
CONFIG_NFS_FS=n
CONFIG_NFS_V4=n
CONFIG_NFSD=n
CONFIG_SUNRPC=n
# 9P (Plan 9 / virtio host-folder sharing for VM guests): enabled by the arm64
# defconfig and the kernel-cache container feature, unused on bare metal. Its
# removal also drops NETFS_SUPPORT, which nothing else here selects.
CONFIG_NET_9P=n
CONFIG_9P_FS=n

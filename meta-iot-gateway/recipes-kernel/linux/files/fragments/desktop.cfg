# Desktop image peripherals (igw_desktop, set by kas/desktop.yml).
#
# The gateway kernel carries none of these; the desktop image runs Weston on
# the HDMI outputs and is used with ordinary keyboards, mice, tablets and USB
# audio. Weston reads input through libinput/evdev, so the legacy mousedev
# interface is not needed.

# HDMI-CEC on the VC4 HDMI ports (TV remote and power control).
CONFIG_DRM_VC4_HDMI_CEC=y

# USB audio class devices (headsets, USB sound cards).
CONFIG_SND_USB_AUDIO=m

# Bluetooth LE keyboards and mice: BlueZ implements HID-over-GATT in userspace
# through UHID.
CONFIG_UHID=m
CONFIG_HIDRAW=y

# Logitech Unifying/Lightspeed receivers and Wacom tablets need their own HID
# drivers; hid-generic covers only the basic report descriptors.
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_WACOM=m

# Runtime root dm-verity (always on; the igw_rootfs_verity kernel feature).
#
# There is no initramfs: the kernel itself creates the verity root device from
# the dm-mod.create= parameter carried in the signed boot arguments.
#
# dm-mod.create= is only honoured when DM_INIT is built in. Without it the
# parameter is silently ignored, /dev/dm-0 never appears and the root mount
# fails with nothing pointing at the cause.
CONFIG_DM_INIT=y

# The verity hash is instantiated through the crypto-API shash "sha256" from
# dm-init at late_initcall, before any module can load. A modular CRYPTO_SHA256
# fails the root table with "Cannot initialize hash function (-ENOENT)" and the
# root device never appears, so it must be built in. (lib/crypto's SHA-256
# hardware path is a different symbol and does not satisfy the mapper.)
# Today another built-in symbol happens to select it; stating it here keeps this
# feature from depending on that.
CONFIG_CRYPTO_SHA256=y

# Podman/containers-storage configuration for the gateway.
#
# Containers run rootless as the iotgw-ctr principal, whose store is the
# per-user default ($HOME/.local/share/containers/storage, on /data through
# the /home bind); graphroot/runroot below are ignored for rootless users and
# only describe the rootful store, which no unit uses and which lives on the
# volatile /var/lib (podman as root works for administration but keeps
# nothing across a reboot).
#
# The overlay driver runs on the kernel's own overlayfs (no mount_program):
# the kernel supports unprivileged overlay mounts inside a user namespace, so
# rootless needs no FUSE helper either, and fuse-overlayfs would put a
# userspace filesystem in front of every container file access.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
# Device nodes in image layers are never honoured through the overlay.
mountopt = "nodev"

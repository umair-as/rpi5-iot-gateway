[engine]
cgroup_manager = "systemd"
events_logger = "journald"
runtime = "crun"
# Image layers are staged under <graphroot>/tmp instead of /var/tmp, which is
# a tmpfs on this image: a pull then costs disk on /data, not RAM. For the
# rootless principal that is ~/.local/share/containers/storage/tmp, shipped
# with the home (iotgw-ctr-user).
image_copy_tmp_dir = "storage"

[containers]
log_driver = "journald"
pids_limit = 4096
tz = "local"
ipcns = "private"
cgroups = "enabled"
# The default profile, shipped as a file so the syscall allowlist is auditable
# on the device (podman package); the path is podman's built-in default.
seccomp_profile = "/usr/share/containers/seccomp.json"

[network]
network_backend = "netavark"
# The iotgw kernel is nftables-only (no legacy ip_tables modules); netavark's
# default iptables driver fails at container start with "Module ip_tables not
# found".
firewall_driver = "nftables"
# Rootless containers get their network from pasta (passt), which runs as the
# container's user in its namespace; no setuid helper, no slirp4netns.
default_rootless_network_cmd = "pasta"

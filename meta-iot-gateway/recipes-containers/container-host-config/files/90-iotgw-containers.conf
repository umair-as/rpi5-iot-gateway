# Container networking and namespace defaults for gateway hosts.
net.ipv4.ip_forward = 1
# No net.bridge.bridge-nf-call-*: podman's netavark programs nftables itself and
# does not need bridged frames passed to the IP hooks, and enabling it would send
# br0's bridged LAN traffic through the host firewall. It also needs br_netfilter,
# which nothing loads, so the keys would only fail at boot.
user.max_user_namespaces = 28633

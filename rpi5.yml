header:
  version: 18

distro: iotgw

machine: raspberrypi5

target:
  - iot-gw-image-base

repos:

  # Upstream Yocto layers — SHA-pinned to the wrynose (Yocto 6.0) baseline so
  # shared native/cross/allarch sstate and source downloads are reused. Layers
  # resolve via git alternates from KAS_REPO_REF_DIR (see Makefile); pins stay
  # enforced.
  bitbake:
    url: https://git.openembedded.org/bitbake
    # 2.18 branch tip, 2026-07-09. Moves with the poky cluster: bump this,
    # openembedded-core and meta-openembedded together or not at all.
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    # wrynose branch tip. meta-openembedded stays at its own pin below: the
    # class/python API is stable within wrynose.
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    # wrynose branch tip, 2026-07-30. Shares oe-core's class/python API, so it
    # moves in lockstep with the poky cluster above; carries userland CVE
    # backports (99 distinct CVE ids since the previous pin -- jq alone gained
    # ten).
    commit: 6bf0d8ad57b33950bab4c7f6c037e1ccb6f6e2eb
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    # wrynose branch tip, pinned by commit.
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    # wrynose branch tip, 2026-11-05. Moves independently of the poky cluster:
    # it is mostly container-stack CVE fixes and declares no newer oe-core API.
    branch: wrynose
    commit: 4a9f704d82a8a5d65aaffa598eeaeb86f1cb5b86

  # meta-rust-bin dropped: wrynose OE-core ships rust/cargo 1.94.1 (the version
  # meta-rust-bin used to pin), and meta-rust-bin master lacks wrynose
  # LAYERSERIES_COMPAT. tpm-ops now inherits the OE-core `cargo` class instead
  # of `cargo_bin`.

  # SELinux MAC stack: libselinux/policycoreutils/setools, the refpolicy
  # variants, packagegroup-core-selinux, and selinux-image.bbclass. Also
  # ships ~36 <recipe>_%.bbappend files that flip PACKAGECONFIG[selinux] on
  # in oe-core/meta-oe recipes (systemd, dbus, openssh, sudo, PAM, ...)
  # whenever DISTRO_FEATURES contains "selinux". The distro-features wiring
  # lives in iotgw-common.inc; the kernel-side LSM symbols in
  # security-prod.cfg. See docs/SELINUX.md.
  #
  # Pinned on master, not wrynose: master carries the refpolicy 2.20260616
  # release (systemd-networkd denial fixes, subs_dist /sbin aliasing) and still
  # declares LAYERSERIES_COMPAT "wrynose". Return to the wrynose branch once it
  # carries that refpolicy. This is the last wrynose-compatible master commit:
  # master moved to LAYERSERIES_COMPAT "blacksail" right after it, so later
  # wrynose-branch fixes are carried below as verbatim upstream patches.
  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: master
    commit: 7351443c6579671bcf048817438f1740ad23eaab
    patches:
      # seunshare CVE-2026-59676/59677 from the wrynose branch: CVE_STATUS for
      # the components that do not build seunshare, and the selinux-sandbox fix.
      # Drop these when the pin returns to the wrynose branch.
      0001-cve-2026-59676-status:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0001-selinux-ignore-CVE-2026-59676-in-components-excludin.patch
      0002-cve-2026-59677-status:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0002-selinux-ignore-CVE-2026-59677-in-components-excludin.patch
      0003-selinux-sandbox-cve-2026-59676:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0003-selinux-sandbox-fix-CVE-2026-59676.patch
      0004-selinux-sandbox-cve-2026-59677:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0004-selinux-sandbox-fix-CVE-2026-59677.patch
      # Build-host independence: label the image against its own policy, not
      # the policy loaded on the build host (fails on SELinux-enforcing hosts).
      0005-selinux-image-validate-contexts:
        repo: rpi5-iot-gw
        path: patches/meta-selinux/0005-selinux-image-validate-contexts-against-the-image-policy.patch

  # Project layer lives in this repo. No url/path: kas resolves it against the
  # repo containing this kas file, so layer paths under `layers:` are relative
  # to the repo root. Sidesteps the path:-vs-KAS_WORK_DIR interaction — a bare
  # `path: meta-iot-gateway` resolves to .kas/meta-iot-gateway once
  # KAS_WORK_DIR=.kas is set (see Makefile).
  rpi5-iot-gw:
    layers:
      meta-iot-gateway:

bblayers_conf_header:
  standard: |
    BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"

  diskmon: |
    # Disk guard. Raised 2026-09-01 from poky's stock 1G/100M, which is far too
    # low for this tree: a full image build consumes tens of GiB, so STOPTASKS
    # at 1 GiB free only fires once the disk is already effectively full, and
    # HALT at 100 MiB fires after damage is done. On this host TMPDIR lives on
    # the operator's /home, so an unguarded runaway is not merely a failed build.
    #
    # Measured on the 2026-09-01 desktop build: /home went 75G -> 51G free
    # (92% used) while building a single image variant. A 15 GiB stop floor
    # leaves room to notice and intervene; 10 GiB halt is the hard backstop.
    #
    # Format is ACTION,DIR,MIN_FREE_SPACE,MIN_FREE_INODES. /tmp keeps its own
    # smaller thresholds deliberately — it is a small tmpfs used for scratch,
    # not a build output tree, so the 15G/10G floors would trip permanently.
    BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},15G,100K \
    STOPTASKS,${DL_DIR},15G,100K \
    STOPTASKS,${SSTATE_DIR},15G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},10G,1K \
    HALT,${DL_DIR},10G,1K \
    HALT,${SSTATE_DIR},10G,1K \
    HALT,/tmp,10M,1K"

  buildinfo: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  spdx_disable: |
    # Keep SBOM/CVE generation opt-in via kas/cve.yml to save disk/time on
    # normal image builds. Wrynose's sbom-cve-check flow enables create-spdx
    # when the CVE overlay is composed.
    IOTGW_CREATE_SPDX_DISABLE ?= "create-spdx"
    INHERIT:remove = "${IOTGW_CREATE_SPDX_DISABLE}"

  optimize: |
    USER_CLASSES = "buildstats"

  parallel: |
    BB_NUMBER_THREADS = "10"
    PARALLEL_MAKE = "-j12"
  rm_work: |
    # Reduce disk usage by discarding intermediate workdirs
    INHERIT += "rm_work"

  rpi_hardware: |
    ENABLE_SPI_BUS = "1"
    ENABLE_I2C = "1"
    ENABLE_UART = "1"

  rpi_display: |
    DISABLE_OVERSCAN = "1"
    DISABLE_SPLASH = "1"

  rpi_extras: |
    # Accept the Synaptics WiFi/BT firmware license flag required on RPi
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  image_hw_modules: |
    KERNEL_MODULE_AUTOLOAD:append = " i2c-dev"

  prefer_bin_node: |
    # Use prebuilt Node.js binary to avoid long V8 builds
    PREFERRED_PROVIDER_nodejs = "nodejs-bin"

  sanity_check: |
    # Add Ubuntu 24.04 to tested distributions to avoid warnings
    SANITY_TESTED_DISTROS:append = " ubuntu-24.04"

  hashserve: |
    # Enable hash equivalence for better sstate reuse. Put the hashequiv DB in
    # the shared SSTATE location (not inside build/) so hash-equivalence — and
    # therefore native/cross/allarch sstate — is reused across builds sharing
    # the same SSTATE_DIR.
    #
    # Sstate objects are found by unihash, and each hash-equivalence DB hands
    # out its own unihashes. Builds sharing one SSTATE_DIR only share work when
    # they also share this DB path; otherwise identical tasks diverge from the
    # root of the dependency chain. Moving to another DB path is not free: work
    # already recorded under this DB stops matching (and build/cache/
    # bb_unihashes.dat must be removed for the move to take effect at all).
    # Change it together with a layer-pin move, when everything rebuilds
    # anyway. Measurements: docs/SSTATE_SHARING.md.
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
